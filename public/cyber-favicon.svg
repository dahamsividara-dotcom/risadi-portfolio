<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#090a10" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#cyberGrad)" stroke-width="2" stroke-opacity="0.6" />
  <!-- Hex Shield -->
  <polygon points="32,10 52,20 52,44 32,54 12,44 12,20" stroke="url(#cyberGrad)" stroke-width="3" fill="#141724" fill-opacity="0.8" filter="url(#glow)"/>
  <!-- Central AI node and cross lines -->
  <circle cx="32" cy="32" r="5" fill="#00f0ff" />
  <line x1="32" y1="20" x2="32" y2="27" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="37" x2="32" y2="44" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="26" x2="28" y2="30" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="26" x2="36" y2="30" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="38" x2="28" y2="34" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="36" y2="34" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
</svg>
